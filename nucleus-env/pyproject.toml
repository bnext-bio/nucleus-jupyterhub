[project]
name = "nucleus-env"
version = "0.6.0rc2"
description = "Metapackage to set up a default environment for working with the Nucleus CDK and synthetic cells."
readme = "README.md"
requires-python = ">=3.12"
authors = [ 
  {name="Anton Jackson-Smith", email="anton@bnext.bio"},
]
maintainers = [
  {name="Anton Jackson-Smith", email="anton@bnext.bio"},
]
homepage = "https://nucleus.bnext.bio/"
repository = "https://github.com/bnext-bio/nucleus/"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
  "synthetic biology",
  "synthetic cell",
  "syncell",
  "cellfree",
  "nucleus",
  "cell developer kit"
]
dependencies = [
    "tqdm>=4.67.1",
    # numba (via nucleus-cdk -> shap) caps numpy: the latest resolvable numba
    # (0.66.x) requires numpy<2.5. Without this ceiling the resolver floats numpy
    # up and backslides numba/llvmlite to unbuildable ~2020 releases. See the
    # `environments` note under [tool.uv].
    "numpy>=1.26.4,<2.5",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "anywidget>=0.9.18",
    "jupyter-collaboration>=1.1.0",
    "ipympl>=0.9.7",
    "jupyterlab-templates>=0.5.2",
    "nucleus-cdk>=0.6.0rc2",
    "ipykernel>=6.29.5",
    # No Napari for now
    # "triangle", # https://blog.rtwilson.com/how-to-install-the-python-triangle-package-on-an-apple-silicon-mac/
    # "napari[all]>=0.5.6",
    "jupyterlab-git>=0.51.0",
    "python-lsp-server[all]>=1.12.2",
    "jupyterlab-link-share>=0.3.0",
    "jupyterlab-lsp>=5.1.0",
    "jupyter-server-proxy>=4.4.0",
    "vizarr>=0.1.1",
    "scikit-image>=0.25.2",
    "fsspec>=2025.3.2",
    "zarr>=2.18.5",
    "jupyter-app-launcher>=0.3.2",
    "tabulate>=0.9.0",
    "statsmodels>=0.14.4",
    "biocrnpyler>=1.1.1",
    "yq>=3.4.3",
    "jupyter-ai>=3.0.0",
    "jupyterlab-chat>=0.21.1",
    "pyarrow>=18.0.0",
    "pyproject-local-kernel>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "14 days"
# Only resolve for platforms we actually target: the Linux deploy image
# (Dockerfile.notebook) and Apple Silicon dev machines. This drops Intel macOS
# (x86_64 darwin), whose shap `numba<0.63` / `llvmlite<0.46` pins would
# otherwise cap the *entire* universal lock at numba 0.62.x. With Intel macOS
# excluded, shap leaves numba/llvmlite unconstrained and the resolver can reach
# numba 0.66 + llvmlite 0.48 (both wheels). Paired with the numpy<2.5 ceiling
# on the numpy dependency above.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
triangle = { git = "https://github.com/drufat/triangle.git" }
jupyter-app-launcher = { git = "https://github.com/antonjs/jupyter_app_launcher.git" }
vizarr = { git = "https://github.com/hms-dbmi/vizarr.git", subdirectory = "python/" }

