# JupyterHub docker compose configuration file
services:
  hub:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.jupyterhub
    restart: always
    image: nucleushub-hub
    volumes:
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"

      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "hub-data:/data"

      # Bind SSS for user auth info
      - /var/lib/sss/pipes:/var/lib/sss/pipes
      - /var/lib/sss/mc:/var/lib/sss/mc:ro
      - /etc/nsswitch.conf:/etc/nsswitch.conf:ro
    environment:
      HUB_LOG_LEVEL: ${HUB_LOG_LEVEL:-INFO}
      HUB_HOSTNAME: ${HUB_HOSTNAME:-hub}
      HUB_NETWORK_NAME: ${HUB_NETWORK:-jupyterhub_default}
      HUB_NOTEBOOK_IMAGE: nucleushub-notebook:latest
      HUB_NOTEBOOK_DIR: /home/jovyan/
      HUB_OAUTH_CLIENT_ID: ${HUB_OAUTH_CLIENT_ID}
      HUB_OAUTH_CLIENT_SECRET: ${HUB_OAUTH_CLIENT_SECRET}
      HUB_OAUTH_AUTH_URL: ${HUB_OAUTH_AUTH_URL}
      HUB_OAUTH_TOKEN_URL: ${HUB_OAUTH_TOKEN_URL}
      HUB_OAUTH_USERDATA_URL: ${HUB_OAUTH_USERDATA_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hub.rule=Host(`${HUB_HOSTNAME:-hub}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hub.entrypoints=websecure"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-hub.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik

